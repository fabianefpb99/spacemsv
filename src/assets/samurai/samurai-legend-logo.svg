<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="Samurai Legend">
  <defs>
    <linearGradient id="samuraiSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8dbe4"/>
      <stop offset="100%" stop-color="#7d8393"/>
    </linearGradient>
    <linearGradient id="samuraiRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7f1024"/>
    </linearGradient>
    <radialGradient id="samuraiMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe1e1"/>
      <stop offset="55%" stop-color="#ff5b7a"/>
      <stop offset="100%" stop-color="#5b0f22" stop-opacity="0"/>
    </radialGradient>
    <filter id="samuraiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="300" cy="90" r="80" fill="url(#samuraiMoon)" opacity="0.85"/>
  <g filter="url(#samuraiGlow)">
    <text x="300" y="98" text-anchor="middle"
      font-family="'Cinzel','Trajan Pro',Georgia,serif" font-weight="900"
      font-size="66" letter-spacing="6" fill="url(#samuraiSteel)"
      stroke="#1a0410" stroke-width="2">SAMURAI</text>
    <text x="300" y="160" text-anchor="middle"
      font-family="'Cinzel','Trajan Pro',Georgia,serif" font-style="italic" font-weight="900"
      font-size="52" letter-spacing="10" fill="url(#samuraiRed)"
      stroke="#1a0410" stroke-width="1.5">LEGEND</text>
  </g>
  <g opacity="0.95">
    <path d="M60 190 L540 190" stroke="#a855f7" stroke-width="1.2" opacity="0.35"/>
    <path d="M120 195 L480 195" stroke="url(#samuraiSteel)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M118 195 L100 190 L100 200 Z" fill="#7f1024" stroke="#1a0410" stroke-width="1"/>
    <path d="M482 195 L500 190 L500 200 Z" fill="#7f1024" stroke="#1a0410" stroke-width="1"/>
  </g>
  <g fill="#ff9bb4" opacity="0.9">
    <circle cx="90" cy="70" r="2.5"/>
    <circle cx="120" cy="45" r="2"/>
    <circle cx="500" cy="60" r="2.5"/>
    <circle cx="470" cy="35" r="2"/>
    <circle cx="70" cy="120" r="2"/>
    <circle cx="520" cy="130" r="2"/>
  </g>
</svg>